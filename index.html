<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐỨC MẠNH MOBILE - Hệ Thống Báo Giá & Quản Lý Linh Kiện Realtime</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* HEADER */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--accent);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .logo-text p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .search-global {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

        .search-global input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-global input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
        }

        .search-global i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* MAIN CONTENT */
        main {
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* SIDEBAR: BRAND & MODEL SELECTION */
        .sidebar {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 0.75rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .brand-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .brand-btn:hover, .brand-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .model-list {
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
        }

        .model-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-btn:hover {
            background: var(--bg-card);
        }

        .model-btn.active {
            background: rgba(37, 99, 235, 0.2);
            border-color: var(--accent);
            color: #60a5fa;
            font-weight: 600;
        }

        /* CONTENT AREA: PRICING TABLE */
        .content-area {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border);
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .model-info h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .model-info span {
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(37, 99, 235, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { filter: brightness(1.1); }

        /* TABLE DESIGN */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: var(--bg-primary);
            color: var(--text-sub);
            padding: 10px 12px;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .input-price {
            width: 110px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            color: #fff;
            font-size: 0.85rem;
            text-align: right;
        }

        .input-price:focus {
            border-color: var(--accent);
            outline: none;
        }

        .margin-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .margin-good { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .margin-low { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        /* MODAL ZALO COPY */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
            resize: none;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="logo-text">
                    <h1>ĐỨC MẠNH MOBILE</h1>
                    <p>Hệ Thống Báo Giá Linh Kiện & Dịch Vụ Sửa Chữa</p>
                </div>
            </div>

            <div class="search-global">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="globalSearch" placeholder="Tìm nhanh dòng máy (VD: 15 Pro Max, S24 Ultra...)" oninput="handleSearch()">
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main>
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="section-title">Thương Hiệu</div>
            <div class="brand-list" id="brandList"></div>

            <div class="section-title" style="margin-top: 1rem;">
                Danh Sách Model
                <span id="modelCount" style="font-size: 0.75rem; color: var(--accent);">0</span>
            </div>
            <div class="model-list" id="modelList"></div>
        </aside>

        <!-- MAIN TABLE AREA -->
        <section class="content-area">
            <div class="model-header">
                <div class="model-info">
                    <span id="selectedBrand">APPLE</span>
                    <h2 id="selectedModel">iPhone 15 Pro Max</h2>
                </div>
                <div class="action-btns">
                    <button class="btn btn-success" onclick="openZaloModal()">
                        <i class="fa-solid fa-copy"></i> Copy Gửi Zalo
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Hạng Mục Sửa Chữa / Linh Kiện</th>
                            <th>Giá Nhập (VNĐ)</th>
                            <th>Giá Thay Thế / Sửa (VNĐ)</th>
                            <th>Lợi Nhuận (%)</th>
                            <th>Bảo Hành</th>
                        </tr>
                    </thead>
                    <tbody id="priceTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- MODAL COPY BÁO GIÁ -->
    <div class="modal" id="zaloModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-share-nodes"></i> Mẫu Báo Giá Khách Hàng</h3>
                <button onclick="closeZaloModal()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="zaloText" readonly></textarea>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="copyToClipboard()">
                <i class="fa-solid fa-paste"></i> Sao Chép Tin Nhắn
            </button>
        </div>
    </div>

    <script>
        // Standard 16 repair services
        const SERVICES = [
            "Thay màn", "Thay pin", "Thay lưng", "Thay kính cam",
            "Thay sạc", "Thay loa trên", "Thay loa dưới", "Thay nút nguồn",
            "Thay nút volume", "Thay đèn flash", "Thay vỏ", "Sửa Face ID",
            "Thay cáp loa trên", "Ép kính", "Ép cáp", "Ép IC kính"
        ];

        // Database of Brands & Models
        const DATABASE = {
            "Apple": [
                "iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 17", "iPhone Air",
                "iPhone 16 Pro Max", "iPhone 16 Pro", "iPhone 16 Plus", "iPhone 16",
                "iPhone 15 Pro Max", "iPhone 15 Pro", "iPhone 15 Plus", "iPhone 15",
                "iPhone 14 Pro Max", "iPhone 14 Pro", "iPhone 14 Plus", "iPhone 14",
                "iPhone 13 Pro Max", "iPhone 13 Pro", "iPhone 13", "iPhone 13 mini",
                "iPhone 12 Pro Max", "iPhone 12 Pro", "iPhone 12", "iPhone 11 Pro Max",
                "iPhone 11", "iPhone XS Max", "iPhone XR", "iPhone X", "iPhone 8 Plus"
            ],
            "Samsung": [
                "Galaxy S26 Ultra", "Galaxy S26+", "Galaxy S26",
                "Galaxy S25 Ultra", "Galaxy S25+", "Galaxy S25",
                "Galaxy Z Fold 7", "Galaxy Z Flip 7", "Galaxy Z Fold 6", "Galaxy Z Flip 6",
                "Galaxy S24 Ultra", "Galaxy S24+", "Galaxy S24",
                "Galaxy S23 Ultra", "Galaxy S23 FE", "Galaxy S22 Ultra", "Galaxy A55", "Galaxy A35"
            ],
            "Xiaomi": [
                "Xiaomi 15 Pro", "Xiaomi 15", "Xiaomi 14 Ultra", "Xiaomi 14", 
                "Redmi Note 14 Pro+", "Redmi Note 13 Pro", "Redmi Note 12", "POCO F6 Pro"
            ],
            "OPPO": [
                "Find X8 Pro", "Find X7 Ultra", "Reno 12 Pro", "Reno 11", "OPPO A79"
            ],
            "vivo": [
                "X100 Pro", "X90 Pro", "V30 Pro", "Y200"
            ],
            "Google": [
                "Pixel 10 Pro", "Pixel 9 Pro XL", "Pixel 9", "Pixel 8 Pro", "Pixel 7a"
            ]
        };

        // Price Store (Format: prices[modelName][serviceName] = { cost: 0, sell: 0, warranty: '3 Tháng' })
        let priceStore = {};
        let currentBrand = "Apple";
        let currentModel = "iPhone 15 Pro Max";

        // INIT APP
        window.onload = () => {
            renderBrands();
            selectBrand("Apple");
        };

        function renderBrands() {
            const brandContainer = document.getElementById("brandList");
            brandContainer.innerHTML = "";
            Object.keys(DATABASE).forEach(brand => {
                const btn = document.createElement("button");
                btn.className = `brand-btn ${brand === currentBrand ? 'active' : ''}`;
                btn.innerText = brand;
                btn.onclick = () => selectBrand(brand);
                brandContainer.appendChild(btn);
            });
        }

        function selectBrand(brand) {
            currentBrand = brand;
            renderBrands();
            renderModels(DATABASE[brand]);
            if (DATABASE[brand].length > 0) {
                selectModel(DATABASE[brand][0]);
            }
        }

        function renderModels(models) {
            const modelContainer = document.getElementById("modelList");
            document.getElementById("modelCount").innerText = models.length;
            modelContainer.innerHTML = "";
            models.forEach(model => {
                const btn = document.createElement("button");
                btn.className = `model-btn ${model === currentModel ? 'active' : ''}`;
                btn.innerHTML = `<span>${model}</span> <i class="fa-solid fa-chevron-right" style="font-size:0.7rem;"></i>`;
                btn.onclick = () => selectModel(model);
                modelContainer.appendChild(btn);
            });
        }

        function selectModel(model) {
            currentModel = model;
            document.getElementById("selectedBrand").innerText = currentBrand.toUpperCase();
            document.getElementById("selectedModel").innerText = model;
            
            // Highlight model button
            document.querySelectorAll(".model-btn").forEach(btn => {
                if (btn.innerText.trim() === model) btn.classList.add("active");
                else btn.classList.remove("active");
            });

            renderPriceTable();
        }

        function renderPriceTable() {
            const tbody = document.getElementById("priceTableBody");
            tbody.innerHTML = "";

            if (!priceStore[currentModel]) {
                priceStore[currentModel] = {};
            }

            SERVICES.forEach((service, index) => {
                if (!priceStore[currentModel][service]) {
                    // Default values
                    priceStore[currentModel][service] = { cost: 0, sell: 0, warranty: "3 Tháng" };
                }

                const data = priceStore[currentModel][service];
                const margin = data.sell > 0 ? Math.round(((data.sell - data.cost) / data.sell) * 100) : 0;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${service}</strong></td>
                    <td>
                        <input type="text" class="input-price" value="${formatCurrency(data.cost)}" 
                            onchange="updatePrice('${service}', 'cost', this.value)">
                    </td>
                    <td>
                        <input type="text" class="input-price" style="color: #60a5fa; font-weight:600;" 
                            value="${formatCurrency(data.sell)}" 
                            onchange="updatePrice('${service}', 'sell', this.value)">
                    </td>
                    <td>
                        <span class="margin-tag ${margin >= 30 ? 'margin-good' : 'margin-low'}">${margin}%</span>
                    </td>
                    <td>
                        <input type="text" class="input-price" style="width:90px; text-align:center;" 
                            value="${data.warranty}" 
                            onchange="updatePrice('${service}', 'warranty', this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updatePrice(service, field, val) {
            if (field === 'cost' || field === 'sell') {
                const num = parseInt(val.replace(/\D/g, '')) || 0;
                priceStore[currentModel][service][field] = num;
            } else {
                priceStore[currentModel][service][field] = val;
            }
            renderPriceTable();
        }

        function formatCurrency(num) {
            if (!num) return "0";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // GLOBAL SEARCH FUNCTION
        function handleSearch() {
            const query = document.getElementById("globalSearch").value.toLowerCase().trim();
            if (!query) {
                renderModels(DATABASE[currentBrand]);
                return;
            }

            let matches = [];
            Object.keys(DATABASE).forEach(brand => {
                DATABASE[brand].forEach(model => {
                    if (model.toLowerCase().includes(query)) {
                        matches.push({ brand, model });
                    }
                });
            });

            const modelContainer = document.getElementById("modelList");
            document.getElementById("modelCount").innerText = matches.length;
            modelContainer.innerHTML = "";

            matches.forEach(item => {
                const btn = document.createElement("button");
                btn.className = `model-btn ${item.model === currentModel ? 'active' : ''}`;
                btn.innerHTML = `<span>${item.model} <small style="color:var(--text-sub);">(${item.brand})</small></span>`;
                btn.onclick = () => {
                    currentBrand = item.brand;
                    renderBrands();
                    selectModel(item.model);
                };
                modelContainer.appendChild(btn);
            });

            if (matches.length > 0 && query.length > 2) {
                currentBrand = matches[0].brand;
                selectModel(matches[0].model);
            }
        }

        // ZALO MODAL
        function openZaloModal() {
            const modal = document.getElementById("zaloModal");
            const textarea = document.getElementById("zaloText");
            
            let text = `📱 *BÁO GIÁ SỬA CHỮA - ĐỨC MẠNH MOBILE*\n`;
            text += `📌 *Dòng máy:* ${currentModel}\n`;
            text += `-----------------------------------\n`;

            let hasPrice = false;
            SERVICES.forEach(service => {
                const item = priceStore[currentModel]?.[service];
                if (item && item.sell > 0) {
                    text += `🔹 ${service}: *${formatCurrency(item.sell)} VNĐ* (BH: ${item.warranty})\n`;
                    hasPrice = true;
                }
            });

            if (!hasPrice) {
                text += `(Chưa có giá cập nhật cho dòng máy này, vui lòng liên hệ trực tiếp hotline!)\n`;
            }

            text += `-----------------------------------\n`;
            text += `⚡ *Đức Mạnh Mobile* - Cam kết linh kiện chuẩn, lấy ngay!\n`;
            text += `📞 Hotline/Zalo support tư vấn trực tiếp!`;

            textarea.value = text;
            modal.style.display = "flex";
        }

        function closeZaloModal() {
            document.getElementById("zaloModal").style.display = "none";
        }

        function copyToClipboard() {
            const textarea = document.getElementById("zaloText");
            textarea.select();
            document.execCommand("copy");
            alert("Đã sao chép bảng báo giá! Bạn có thể dán (Paste) trực tiếp vào Zalo gửi khách.");
            closeZaloModal();
        }
    </script>
</body>
</html>
